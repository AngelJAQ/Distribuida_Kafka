# UN BROKER KAFKA POR EQUIPO (cluster de 3 equipos, modo KRaft)
#
# En CADA equipo (PC1, PC2, PC3):
#   1. copia 'equipo.env.ejemplo' como 'equipo.env' y edítalo (NODE_ID, MI_IP y las 3 IP)
#   2. docker compose --env-file equipo.env up -d
#   3. docker compose ps        (debe salir kafka-<N> "Up")
#
# Los 3 brokers forman un cuórum: si un equipo se apaga, los otros dos siguen y el liderazgo
# pasa al siguiente broker en el ORDEN DE PRIORIDAD (1 -> 2 -> 3). Cuando el prioritario
# vuelve, recupera el liderazgo solo.
#
# Puertos que deben estar abiertos entre los equipos: 9092 (clientes y brokers) y 9093 (cuórum).

services:
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka-${NODE_ID:?Falta NODE_ID en equipo.env}
    hostname: kafka-${NODE_ID}
    ports:
      - "9092:9092"
      - "9093:9093"
    environment:
      CLUSTER_ID: cirCrmlfR1KIv_dQKZVYNA          # igual en los 3 equipos
      KAFKA_NODE_ID: ${NODE_ID}
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@${IP_PC1:?Falta IP_PC1}:9093,2@${IP_PC2:?Falta IP_PC2}:9093,3@${IP_PC3:?Falta IP_PC3}:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${MI_IP:?Falta MI_IP}:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_DEFAULT_REPLICATION_FACTOR: 3
      KAFKA_MIN_INSYNC_REPLICAS: 2
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 3
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 2
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"    # los tópicos los crea el programa
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Si el broker prioritario vuelve, recupera el liderazgo en ~10 s (por defecto serían 5 min)
      KAFKA_LEADER_IMBALANCE_CHECK_INTERVAL_SECONDS: 10
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms512m"
    volumes:
      - kafka-data:/var/lib/kafka/data

volumes:
  kafka-data:
